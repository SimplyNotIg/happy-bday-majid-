<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Majid!</title>

    <link rel="stylesheet" href="style.css">

    <!-- Confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>

<body>

    <div class="birthday-container">

        <h1>🎉 Happy Birthday Majid! 🎂</h1>

        <p class="subtitle">
            Hope you have an amazing birthday!
            and may god bless your life!
        </p>

        <!-- CLICK THE PHOTO TO GO TO THE NEXT PAGE -->
        <a href="photos.html">
            <img src="photos/majid.jpg" class="main-photo" alt="Majid">
        </a>

        <p class="click-text">
            hint: Click the photo 
        </p>

    </div>

    <!-- Confetti when the page opens -->
    <script>
        window.onload = function () {

            // First burst
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 }
            });

            // Second burst after a short delay
            setTimeout(function () {
                confetti({
                    particleCount: 100,
                    spread: 120,
                    origin: { x: 0.2, y: 0.6 }
                });

                confetti({
                    particleCount: 100,
                    spread: 120,
                    origin: { x: 0.8, y: 0.6 }
                });
            }, 500);
        };
    </script>

</body>
</html>
